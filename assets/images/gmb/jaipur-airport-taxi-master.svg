<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f1"/><stop offset="1" stop-color="#f6d3bd"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#d9dee3"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter>
</defs>

<rect width="1600" height="1200" fill="url(#sky)"/>
<circle cx="1360" cy="190" r="150" fill="#f5a35c" opacity=".18"/>

<!-- Jaipur skyline -->
<g opacity=".92" transform="translate(920 330)">
  <rect x="0" y="130" width="560" height="250" rx="16" fill="#db7c68"/>
  <rect x="45" y="80" width="95" height="300" rx="14" fill="#e28b74"/>
  <rect x="165" y="35" width="100" height="345" rx="14" fill="#e28b74"/>
  <rect x="290" y="90" width="95" height="290" rx="14" fill="#e28b74"/>
  <rect x="410" y="55" width="95" height="325" rx="14" fill="#e28b74"/>
  <g fill="#fff3eb" opacity=".92">
    <circle cx="92" cy="135" r="16"/><circle cx="92" cy="190" r="16"/><circle cx="92" cy="245" r="16"/>
    <circle cx="215" cy="95" r="16"/><circle cx="215" cy="150" r="16"/><circle cx="215" cy="205" r="16"/><circle cx="215" cy="260" r="16"/>
    <circle cx="337" cy="145" r="16"/><circle cx="337" cy="200" r="16"/><circle cx="337" cy="255" r="16"/>
    <circle cx="457" cy="115" r="16"/><circle cx="457" cy="170" r="16"/><circle cx="457" cy="225" r="16"/><circle cx="457" cy="280" r="16"/>
  </g>
  <g fill="#c76555">
    <path d="M45 80 Q92 20 140 80Z"/><path d="M165 35 Q215 -30 265 35Z"/><path d="M290 90 Q337 30 385 90Z"/><path d="M410 55 Q457 -5 505 55Z"/>
  </g>
</g>

<!-- Plane -->
<g transform="translate(1160 165) rotate(-8)" fill="#24364b">
  <path d="M0 36 L205 0 L220 18 L142 48 L214 80 L202 98 L116 64 L68 118 L45 112 L62 60 L0 49Z"/>
</g>

<!-- road -->
<path d="M0 890 Q800 760 1600 870 L1600 1200 L0 1200Z" fill="url(#road)"/>
<path d="M730 1020 Q1110 965 1510 1000" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity=".9"/>

<!-- brand -->
<g transform="translate(90 90)">
  <circle cx="48" cy="48" r="48" fill="#e56f2d"/>
  <path d="M18 60 Q48 28 80 60" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <path d="M30 62 L66 62 L75 80 L21 80Z" fill="white"/>
  <text x="118" y="42" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#213248">Swiggy Wala</text>
  <text x="120" y="80" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" letter-spacing="4" fill="#e56f2d">TOURS &amp; TRAVELS</text>
</g>

<!-- main content -->
<g transform="translate(95 275)">
  <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#e56f2d">JAIPUR AIRPORT TRANSFER</text>
  <text x="0" y="105" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" fill="#203247">Jaipur Airport</text>
  <text x="0" y="205" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" fill="#203247">Taxi</text>
  <rect x="0" y="255" width="760" height="72" rx="36" fill="#ffffff" opacity=".92"/>
  <text x="34" y="302" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#34495e">Airport Pickup  •  Drop  •  Hotel Transfer</text>
  <text x="0" y="385" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#4f5d6b">Comfortable rides for airport, hotel, railway station</text>
  <text x="0" y="428" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#4f5d6b">&amp; onward Rajasthan travel.</text>
</g>

<!-- feature cards -->
<g transform="translate(95 755)" font-family="Arial,Helvetica,sans-serif">
  <g filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="130" rx="28" fill="#ffffff"/>
    <circle cx="58" cy="65" r="30" fill="#fff0e7"/><path d="M39 68 L78 47 L84 54 L64 70 L81 79 L77 86 L58 75 L45 91 L38 88 L43 72Z" fill="#e56f2d"/>
    <text x="105" y="56" font-size="25" font-weight="800" fill="#203247">Airport</text><text x="105" y="88" font-size="22" fill="#596979">Pickup &amp; Drop</text>
  </g>
  <g transform="translate(305 0)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="130" rx="28" fill="#ffffff"/>
    <rect x="30" y="38" width="58" height="58" rx="9" fill="#203247"/><rect x="42" y="50" width="12" height="12" fill="white"/><rect x="64" y="50" width="12" height="12" fill="white"/><rect x="42" y="72" width="34" height="12" fill="white"/>
    <text x="105" y="56" font-size="25" font-weight="800" fill="#203247">Hotel</text><text x="105" y="88" font-size="22" fill="#596979">Transfer</text>
  </g>
  <g transform="translate(610 0)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="130" rx="28" fill="#ffffff"/>
    <rect x="30" y="40" width="62" height="52" rx="10" fill="#e56f2d"/><rect x="39" y="49" width="44" height="17" fill="white"/><circle cx="46" cy="94" r="8" fill="#203247"/><circle cx="76" cy="94" r="8" fill="#203247"/>
    <text x="110" y="56" font-size="25" font-weight="800" fill="#203247">Railway</text><text x="110" y="88" font-size="22" fill="#596979">Connection</text>
  </g>
</g>

<!-- taxi -->
<g transform="translate(865 680)" filter="url(#shadow)">
  <path d="M105 185 L170 75 Q195 35 250 32 L470 32 Q525 35 555 80 L615 185Z" fill="#ffffff"/>
  <path d="M200 75 Q215 52 255 50 L455 50 Q490 52 512 78 L545 130 L170 130Z" fill="#b8d8e6"/>
  <rect x="70" y="165" width="590" height="150" rx="48" fill="#ffffff"/>
  <rect x="80" y="208" width="570" height="28" rx="12" fill="#e56f2d"/>
  <rect x="125" y="185" width="85" height="48" rx="18" fill="#203247"/>
  <rect x="530" y="185" width="85" height="48" rx="18" fill="#203247"/>
  <circle cx="190" cy="315" r="58" fill="#263746"/><circle cx="190" cy="315" r="28" fill="#b8bdc2"/>
  <circle cx="540" cy="315" r="58" fill="#263746"/><circle cx="540" cy="315" r="28" fill="#b8bdc2"/>
  <text x="290" y="205" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#203247">SWIGGY WALA</text>
  <text x="330" y="270" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#e56f2d">TOURS &amp; TRAVELS</text>
</g>

<!-- footer -->
<rect x="95" y="1060" width="1410" height="90" rx="45" fill="#203247"/>
<text x="145" y="1117" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">swiggywala.com</text>
<text x="920" y="1117" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#ffffff">Safe • Reliable • Comfortable Travel</text>
</svg>