name: Full Swiggy Wala Content Migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate_full_content.py'
      - '.github/workflows/full-content-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target theme repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrate complete source content and assets
        run: python tools/migrate_full_content.py

      - name: Commit migrated content without overwriting parallel work
        run: |
          git config user.name "Swiggy Wala Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Migrate complete Swiggy Wala source content"
          git fetch origin main
          # Rebase onto the newest main. If a parallel worker touched the same file,
          # keep the already-published main version and apply all non-conflicting migration files.
          git rebase -X ours origin/main
          git push origin main
